name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Parse Python without executing it
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = list(Path("raspberry").rglob("*.py"))
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"Validated {len(files)} Python files")
          PY
      - name: Parse PowerShell without executing it
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem windows-agent -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | Format-List
            exit 1
          }
